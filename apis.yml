name: Healf
description: >-
  Healf (healf.mx) is a Mexico City-based InsurTech startup founded in 2022 that
  offers an AI-based SaaS platform to simplify, explain, and manage medical /
  health insurance policies. Using generative AI, natural language processing,
  and information-retrieval models, the platform automates repetitive inquiries,
  provides 24/7 conversational support to insurance brokers, and gives the
  insured comprehensive insight into their policy details for better-informed
  decisions. For brokers and doctors it streamlines communication and automates
  processes, improving transparency and traceability for insurers. Healf is a
  500 Global portfolio company (Somos Lucha Batch 19), also backed by Blue Zone
  Ventures. This profile currently has no public API, developer portal, or
  machine-readable specification surface.
